{% extends "base.html" %}

{% block title %}Panier - MangaBook V2{% endblock %}

{% block content %}
<section class="catalog-page public-content-page">
  <header class="catalog-page__header">
    <h2>Panier</h2>
    <p>Espace de synthèse des articles sélectionnés.</p>
  </header>

  <section class="public-info-card card">
    <h3>Page panier</h3>
    <p>Cette page restaure l’accès public attendu dans MangaBook V2.</p>
    <div class="public-info-card__actions">
      <a href="{{ url_for('public.articles') }}" class="btn btn-primary">Catalogue</a>
      <a href="{{ url_for('public.help_page') }}" class="btn btn-secondary">Aide</a>
    </div>
  </section>
</section>
{% endblock %}
